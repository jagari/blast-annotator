name: Build Windows app

on:
  workflow_dispatch:      # GitHub 웹에서 'Run workflow' 버튼으로 실행
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BLAST_Analyzer_Windows
          path: |
            build_win/BLAST_Analyzer_Setup.exe
            build_win/BLAST_Analyzer_portable.zip
          retention-days: 30
